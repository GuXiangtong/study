{% extends "base.html" %}
{% block title %}试卷导入 - 高考错题复习助手{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📄 试卷导入</h1>
    <p>上传整张试卷（PDF 或图片），自动识别并拆分题目</p>
</div>

<div class="card">
    <h2>上传试卷</h2>
    <form method="POST" enctype="multipart/form-data" class="paper-upload-form">
        <div class="form-group">
            <label>学科 <span class="required">*</span></label>
            <select name="subject_id" required>
                <option value="">-- 请选择学科 --</option>
                {% for s in subjects %}
                <option value="{{ s.id }}"{% if prev_subject_id == s.id %} selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>选择已有考试</label>
                <select name="exam_id" id="examSelect">
                    <option value="">-- 或创建新考试 --</option>
                    {% for e in exams %}
                    <option value="{{ e.id }}" data-subject="{{ e.subject_id }}"{% if prev_exam_id == e.id %} selected{% endif %}>
                        {{ e.subject_name }} - {{ e.name }}
                        {% if e.exam_date %}({{ e.exam_date }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row" id="newExamFields">
            <div class="form-group">
                <label>新建考试名称</label>
                <input type="text" name="exam_name" placeholder="例如：高二下期中" value="{{ prev_exam_name or '' }}">
            </div>
            <div class="form-group">
                <label>考试日期</label>
                <input type="date" name="exam_date" value="{{ prev_exam_date or '' }}">
            </div>
        </div>

        <div class="form-group">
            <label>试卷文件 <span class="required">*</span></label>
            <input type="file" name="paper_file" accept=".pdf,.jpg,.jpeg,.png" multiple required>
            <p class="form-hint">支持 PDF、JPG、PNG。可一次选择多张图片；PDF 多页试卷每页可分别框选题目。</p>
        </div>

        <div class="form-group">
            <label class="checkbox-label" style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-weight:normal;">
                <input type="checkbox" name="merge_images" value="1" style="width:16px;height:16px;flex:none;margin-top:3px;">
                <span>
                    <strong>合并为一页</strong>
                    <span class="form-hint" style="display:block;margin-top:2px;">
                        勾选后，上传的多张图片会纵向拼接成一整页——适合一道题跨两张图片的情况，可在一个框里完整框选。
                        不勾选则每张图片各为一页，逐页框选。
                    </span>
                </span>
            </label>
        </div>

        <div class="form-hint" style="background:#eff6ff;padding:12px;border-radius:8px;border:1px solid #bfdbfe;margin-top:12px;">
            <strong>流程说明：</strong>上传后进入框选页面，在图片上手动圈出每道题的范围，完成后点击「识别」提取题目文字，最后导入选中题目。
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" onclick="this.form.submit(); this.disabled=true; this.textContent='上传中...';">
                上传试卷
            </button>
            <a href="{{ url_for('questions.list_questions') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
// Filter exam dropdown by selected subject
const subjectSelect = document.querySelector('[name=subject_id]');
function filterExamsBySubject() {
    const subjectId = subjectSelect.value;
    const examSelect = document.getElementById('examSelect');
    for (const opt of examSelect.options) {
        if (!opt.value) continue;
        opt.style.display = (opt.dataset.subject === subjectId) ? '' : 'none';
    }
}
subjectSelect.addEventListener('change', filterExamsBySubject);
// Apply on load so a subject carried back after a failed submit filters exams.
if (subjectSelect.value) filterExamsBySubject();
</script>
{% endblock %}
